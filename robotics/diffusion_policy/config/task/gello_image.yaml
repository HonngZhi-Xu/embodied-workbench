name: gello_image

shape_meta:
  obs:
    camera_0:
      shape: [3, 480, 640]
      type: rgb
    camera_1:
      shape: [3, 480, 640]
      type: rgb
    camera_2:
      shape: [3, 480, 640]
      type: rgb
    robot_joint:
      shape: [7]
      type: low_dim
  action:
    shape: [7]

dataset:
  _target_: diffusion_policy.dataset.gello_zarr_image_dataset.GelloZarrImageDataset
  shape_meta: ${shape_meta}
  dataset_path: ???

  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}

  n_obs_steps: ${n_obs_steps}

  seed: 42
  val_ratio: 0.1
  check_chunks: true

env_runner:
  _target_: diffusion_policy.env_runner.offline_image_runner.OfflineImageRunner
