<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#3d927a"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5 0 10Z" fill="#8a79b4"/></marker><style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#233d46}.label{font-size:14px;fill:#7b8e96}.title{font-size:21px;font-weight:600}.body{font-size:15px}.small{font-size:12px;fill:#758b93}.box{fill:white;stroke:#dce7e4;stroke-width:1.5}.flow{fill:none;stroke:#3d927a;stroke-width:2;marker-end:url(#a)}.config{fill:none;stroke:#8a79b4;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#b)}</style></defs><rect width="1440" height="1050" fill="#f8faf9"/><text x="58" y="53" class="small" letter-spacing="3">EMBODIED STUDIO / SYSTEM BLUEPRINT</text><text x="58" y="95" font-size="30" font-weight="700">G1 灵巧操作研发平台 · 端—边—云整体架构</text><text x="58" y="124" class="label">一期目标：设备调试 → 示教数采 → 数据管理 → 模型训练 → 实机评测 → 部署回流</text><rect x="58" y="154" width="1324" height="86" rx="12" fill="#173e39"/><text x="83" y="188" fill="#fff" style="fill:white" font-size="19" font-weight="600">统一研发工作台</text><text x="83" y="216" style="fill:#b9d9cc" font-size="14">设备调试　 /　 遥操作数采　 /　 数据管理　 /　 模型中心　 /　 训练实验　 /　 部署运行　 /　 资源监控</text><text x="1110" y="187" style="fill:#bce7d1" font-size="12">本 Demo 已实现前端交互</text><text x="1110" y="211" style="fill:#a0c2b6" font-size="12">模拟服务 · 浏览器本地存储</text><path d="M720 240V275" class="flow"/><text x="739" y="263" class="small">管理接口 / 状态事件（规划）</text><rect x="58" y="279" width="1180" height="206" rx="12" fill="#edf4f8" stroke="#d7e4eb"/><text x="82" y="316" class="title">云 · 训练与资产中心</text><text x="82" y="342" class="small">私有服务器 / GPU 集群</text><rect x="300" y="303" width="270" height="148" rx="9" class="box"/><text x="320" y="334" font-size="17" font-weight="600">数据资产与治理</text><text x="320" y="365" class="body">数据索引 / 对象存储 / 标注</text><text x="320" y="391" class="body">质量检测 / 数据集版本</text><text x="320" y="421" class="small">原始记录 → 训练数据适配</text><rect x="596" y="303" width="285" height="148" rx="9" class="box"/><text x="616" y="334" font-size="17" font-weight="600">训练与评测</text><text x="616" y="365" class="body">ACT / VLA 训练插件</text><text x="616" y="391" class="body">任务调度 / 实验 / 仿真评测</text><text x="616" y="421" class="small">固定代码、数据、环境与随机种子</text><rect x="907" y="303" width="307" height="148" rx="9" class="box"/><text x="927" y="334" font-size="17" font-weight="600">模型注册与发布</text><text x="927" y="365" class="body">权重 / 输入输出规范 / 版本</text><text x="927" y="391" class="body">兼容校验 / 评测结果 / 发布包</text><text x="927" y="421" class="small">策略模型与全身控制器分层管理</text><path d="M570 376H596 M881 376H907" class="flow"/><path d="M436 532V485" class="flow"/><text x="449" y="514" class="small">示教数据 / 执行记录上传</text><path d="M1063 485V532" class="config"/><text x="818" y="514" class="small">模型与配置下发 / 版本撤回</text><rect x="58" y="534" width="1180" height="195" rx="12" fill="#edf7f1" stroke="#d2e8db"/><text x="82" y="571" class="title">边 · 现场计算节点</text><text x="82" y="597" class="small">实验室工作站 / 边缘计算机</text><rect x="300" y="557" width="270" height="145" rx="9" class="box"/><text x="320" y="588" font-size="17" font-weight="600">遥操作与数据采集</text><text x="320" y="619" class="body">TeleopIt / VR 接口 / 手部映射</text><text x="320" y="645" class="body">时间同步 / 片段记录 / 数据检查</text><text x="320" y="675" class="small">本地缓存 / 断点续传</text><rect x="596" y="557" width="285" height="145" rx="9" class="box"/><text x="616" y="588" font-size="17" font-weight="600">策略推理与动作适配</text><text x="616" y="619" class="body">任务指令 / 观测预处理</text><text x="616" y="645" class="body">操作策略 → 动作参考</text><text x="616" y="675" class="small">与全身控制接口进行兼容验证</text><rect x="907" y="557" width="307" height="145" rx="9" class="box"/><text x="927" y="588" font-size="17" font-weight="600">边缘运行管理</text><text x="927" y="619" class="body">模型加载 / 资源与延迟监控</text><text x="927" y="645" class="body">发布切换 / 运行记录 / 失败回流</text><text x="927" y="675" class="small">按节点算力选择端侧或边缘推理</text><path d="M907 629H881" class="config"/><path d="M436 779V729" class="flow"/><text x="449" y="759" class="small">传感观测 / 状态 / 执行反馈</text><path d="M738 729V779" class="flow"/><text x="753" y="759" class="small">带时戳的动作参考 / 控制模式</text><rect x="58" y="781" width="1180" height="176" rx="12" fill="#f5f3ed" stroke="#e6e0d4"/><text x="82" y="818" class="title">端 · 机器人执行层</text><text x="82" y="844" class="small">宇树 G1 + 因时灵巧手</text><rect x="300" y="803" width="270" height="128" rx="9" class="box"/><text x="320" y="835" font-size="17" font-weight="600">设备与传感接入</text><text x="320" y="866" class="body">G1 SDK / 因时驱动 / 相机</text><text x="320" y="894" class="small">机器人状态 / 手部反馈 / 图像</text><rect x="596" y="803" width="285" height="128" rx="9" class="box"/><text x="616" y="835" font-size="17" font-weight="600">本地执行与全身控制</text><text x="616" y="866" class="body">SONIC / SuperMimic 适配层</text><text x="616" y="894" class="small">控制权仲裁 / 指令约束 / 超时处置</text><rect x="907" y="803" width="307" height="128" rx="9" class="box"/><text x="927" y="835" font-size="17" font-weight="600">运行保护与本地日志</text><text x="927" y="866" class="body">看门狗 / 故障状态 / 人工接管</text><text x="927" y="894" class="small">实时控制不依赖云端往返</text><path d="M596 865H570" class="flow"/><path d="M907 865H881" class="flow"/><rect x="1260" y="279" width="122" height="678" rx="12" fill="#f0eef6" stroke="#e0ddeb"/><text x="1321" y="317" text-anchor="middle" font-size="16" font-weight="600">公共支撑</text><g text-anchor="middle" font-size="13"><text x="1321" y="381">设备档案</text><text x="1321" y="442">接口规范</text><text x="1321" y="503">标定版本</text><text x="1321" y="564">身份权限</text><text x="1321" y="625">操作审计</text><text x="1321" y="686">配置管理</text><text x="1321" y="747">日志告警</text><text x="1321" y="808">资源监控</text><text x="1321" y="869">版本追溯</text></g><path d="M60 996H110" class="flow"/><text x="125" y="1001" class="small">业务数据流</text><path d="M270 996H320" class="config"/><text x="335" y="1001" class="small">模型 / 配置下发</text><text x="650" y="1001" class="small">规划架构 · 后端、硬件、算法尚未接入 · 具体部署依据硬件与时延实测确定</text></svg>
