ll="#f6f0e5" stroke="#e9dec9"/><text x="80" y="876" class="name">云 / 远端训练资源（后续扩展）</text><text x="80" y="908" class="body">现阶段计算在本地或实验室 GPU 服务器。跨站点数据同步、模型注册、远端作业与实机策略执行尚为后续建设内容。</text><text x="55" y="976" class="sub">已提供软件驱动与离线验证；真实机器人、相机和触觉传感器仍需在现场完成连接、标定和实测验收。</text></svg>
