260 370V455H950V510" fill="none" stroke="#6d8d86" stroke-width="2" marker-end="url(#arrow)"/><text x="1020" y="432" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#57746f">数据版本 1:N 成员记录</text><path d="M1800 370V455H1500V510" fill="none" stroke="#6d8d86" stroke-width="2" marker-end="url(#arrow)"/><text x="1550" y="432" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#57746f">实验 1:N 模型版本</text><path d="M515 560H565V300H605" fill="none" stroke="#6d8d86" stroke-width="2" marker-end="url(#arrow)"/><text x="455" y="443" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#57746f">任务归属</text><path d="M1595 611H1685" fill="none" stroke="#6d8d86" stroke-width="2" marker-end="url(#arrow)"/><text x="1620" y="593" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#57746f">1:N</text><path d="M1369 715V855" fill="none" stroke="#6d8d86" stroke-width="2" marker-end="url(#arrow)"/><text x="1391" y="792" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#57746f">一个模型可部署多次</text><path d="M1595 955H1685" fill="none" stroke="#6d8d86" stroke-width="2" marker-end="url(#arrow)"/><text x="65" y="1140" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="26" font-weight="650" fill="#315c4c">核心关系</text><text x="65" y="1181" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="20" font-weight="400" fill="#6d8177">设备配置版本 1:N 采集片段；数据集版本 N:M 采集片段，通过 dataset_members 固定来源与训练 / 验证 / 测试划分。</text><text x="65" y="1224" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="20" font-weight="400" fill="#6d8177">数据集版本 1:N 训练实验；训练实验 1:N 模型版本；模型版本 1:N 评测与部署；执行失败片段进入新的采集记录。</text><text x="65" y="1267" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="20" font-weight="400" fill="#6d8177">file_assets 为图像、Zarr、权重、配置、日志与报告登记位置及校验值；实际文件不作为数据库的大型二进制字段存放。</text><text x="65" y="1310" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="20" font-weight="400" fill="#6d8177">首次采用 SQLite + 本地文件目录；多人协作升级 PostgreSQL + 共享文件 / 对象存储，保持唯一 ID 与版本契约不变。</text><text x="65" y="1353" font-family="Microsoft YaHei,SimHei,Arial,sans-serif" font-size="20" font-weight="400" fill="#6d8177">冻结的数据集版本保持成员清单和预处理定义不变；发布的模型包固定权重、归一化、输入输出、设备要求与训练来源。</text></svg>